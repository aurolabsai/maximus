<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Maximus">
  <!-- Märket: Labyrinten (Fas 16, Auro 2026-10-04). Daidalos labyrint i två
       ringar med var sin öppning och en kärna i mitten — vägen in finns,
       vägen ut har bara du. Det här är källan: varje kopia i appen, på
       felsidorna och i tillägget ska vara samma form (test/marke.test.mjs).
       Appikonerna ritas ur den med test/ikonen.mjs. -->
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt">
  <path class="lab-yttre" d="M32 56A24 24 0 1 1 50.39 47.43"/>
  <path class="lab-inre" d="M32 20.5A11.5 11.5 0 1 1 22.58 25.4"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="currentColor"/>
</svg>
