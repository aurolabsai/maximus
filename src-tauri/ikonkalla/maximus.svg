<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Appikonen: Labyrinten (public/marke.svg) i vitt på en platta i grafit,
       med lila bara som kant och ljus (Auro 2026-10-10: "Det är viktigt att
       vi går från en lila till den här grafit + lilac + white-versionen. Jag
       gillar den skarpt."). Tidigare: lila metallic med märket i grafit
       (Fas 48). Marginalen följer macOS: plattan är 824 av 1024.
       Rita om PNG:n och ikonerna med
       node test/ikonen.mjs && npx tauri icon src-tauri/ikonkalla/maximus.png -o src-tauri/icons -->
  <defs>
    <linearGradient id="grafit" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2a2830"/>
      <stop offset="0.55" stop-color="#1d1c22"/>
      <stop offset="1" stop-color="#151419"/>
    </linearGradient>
    <radialGradient id="ljus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9adf5" stop-opacity=".16"/>
      <stop offset="0.6" stop-color="#b9adf5" stop-opacity=".05"/>
      <stop offset="1" stop-color="#b9adf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9bffa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7d6fd6" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#grafit)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ljus)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#kant)" stroke-width="6"/>
  <g transform="translate(232 232) scale(8.75)" color="#f6f5fa">
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt">
  <path class="lab-yttre" d="M32 56A24 24 0 1 1 50.39 47.43"/>
  <path class="lab-inre" d="M32 20.5A11.5 11.5 0 1 1 22.58 25.4"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="currentColor"/>
  </g>
</svg>
