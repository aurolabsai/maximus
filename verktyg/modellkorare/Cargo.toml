[package]
name = "maximus-modell"
version = "1.0.3"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Kör namnmodellen och injektionsvakten (ONNX-filer) med tract, utan Microsofts runtime."

[[bin]]
name = "maximus-modell"
path = "src/main.rs"

[dependencies]
tract-onnx = "=0.23.8"
tract-linalg = { version = "=0.23.8", features = ["multithread-mm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
